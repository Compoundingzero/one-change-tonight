<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
<title id="title">Whole-room versus one-sided cooling</title><desc id="desc">The left half shows cooling arrows across an entire room; the right half shows a single highlighted side of a shared bed.</desc>
<rect width="720" height="320" rx="24" fill="#fffdf8"/><path d="M360 34v252" stroke="#d4cec0" stroke-width="3"/><g fill="none" stroke="#2a7480" stroke-width="5" stroke-linecap="round"><path d="M75 86h215"/><path d="M75 145h215"/><path d="M75 204h215"/></g><g fill="#2a7480"><path d="m290 86-16-10v20z"/><path d="m290 145-16-10v20z"/><path d="m290 204-16-10v20z"/></g><rect x="410" y="76" width="246" height="166" rx="16" fill="#efebe1" stroke="#52625f" stroke-width="3"/><rect x="426" y="96" width="106" height="126" rx="12" fill="#d9eceb" stroke="#215f68" stroke-width="3"/><path d="M533 77v164" stroke="#52625f" stroke-dasharray="7 7"/><text x="181" y="263" fill="#215f68" font-family="system-ui" font-size="18" text-anchor="middle">WHOLE ROOM</text><text x="533" y="270" fill="#215f68" font-family="system-ui" font-size="18" text-anchor="middle">ONE SIDE</text>
</svg>
