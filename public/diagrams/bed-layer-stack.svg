<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
<title id="title">Bed layer stack</title><desc id="desc">Five separated horizontal layers represent the top cover, sleeper, sheet, protector or topper, and mattress.</desc>
